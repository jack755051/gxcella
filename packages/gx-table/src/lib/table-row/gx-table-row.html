<!-- 選擇 Checkbox - 統一寬度和 padding，與 header 一致 -->
@if (selectable()) {
  <td class="gx-table-checkbox-cell">
    <input
      type="checkbox"
      [checked]="selected()"
      [disabled]="disabled()"
      [class]="checkboxClass()"
      (change)="handleSelect()"
    />
  </td>
}

<!-- 資料欄位 -->
@for (column of columns(); track column.key) {
  <td gx-table-cell [column]="column" [row]="row()"></td>
}
