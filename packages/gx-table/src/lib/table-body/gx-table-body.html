<tbody class="divide-y divide-gray-200">
  @for (row of data(); track getRowKey(row, $index)) {
    <gx-table-row
      [row]="row"
      [columns]="columns()"
      [selectable]="selectable()"
      [selected]="isRowSelected(row)"
      [disabled]="checkRowDisabled(row)"
      (select)="handleSelectRow(row)"
    >
      <!-- 傳遞所有插槽到 TableRow -->
      <ng-content></ng-content>
    </gx-table-row>
  }
</tbody>
