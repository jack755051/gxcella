<span
    class="gx-tag"
    [class.gx-tag--clickable]="clickable()"
    [class.gx-tag--disabled]="disabled()"
    [class.gx-tag--removable]="removable()"
    (click)="handleClick($event)">

    <!-- Tag 內容 -->
    <span class="gx-tag-content">
        <ng-content></ng-content>
    </span>

    <!-- 移除按鈕 -->
    @if (removable()) {
        <button
            type="button"
            class="gx-tag-remove"
            [disabled]="disabled()"
            (click)="handleRemove($event)"
            aria-label="Remove tag">
            <!-- X 圖標 -->
            <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M9 3L3 9M3 3L9 9"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>
        </button>
    }
</span>
