<select
    [id]="id()"
    [name]="name()"
    [value]="internalValue()"
    [disabled]="disabled()"
    [attr.intent]="intent()"
    [attr.variant]="variant()"
    [attr.size]="size()"
    class="gx-select"
    (change)="onSelectChange($event)"
>
    <!-- 空選項（Placeholder） -->
    @if (showNullOption()) {
        <option
            value=""
            [disabled]="computedNullOption().disabled"
            [hidden]="computedNullOption().hidden"
        >
            {{ computedNullOption().label }}
        </option>
    }

    <!-- 選項列表 -->
    @for (option of options(); track trackByValue($index, option)) {
        <option
            [value]="option.value"
            [disabled]="option.disabled || false"
        >
            {{ option.label }}
        </option>
    }
</select>
