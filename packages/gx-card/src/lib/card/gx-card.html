<article class="gx-shape" [class]="classes" [ngStyle]="cardStyles" (click)="onCardClick($event)">

  @if (isLegacyMode()) {
    <!-- 向後兼容模式：使用 data input -->
    @if (data()?.header) {
      <gx-card-header
        [data]="data()!.header"
        [headerClickable]="headerClickable()"
        (headerItemClick)="onHeaderItemClick($event)">
      </gx-card-header>
    }

    @if (data()?.content) {
      <gx-card-content
        [data]="data()!.content"
        (tagClick)="onTagClick($event)">
      </gx-card-content>
    }

    @if (data()?.footer) {
      <gx-card-footer
        [data]="data()!.footer"
        (actionClick)="onActionPressed($event)">
      </gx-card-footer>
    }
  } @else {
    <!-- 新模式：使用 ng-content 投影 -->
    <ng-content></ng-content>
  }

</article>
